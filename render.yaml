services:
  - type: web
    name: kenal-e-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r be/requirements.txt && python -m be.scripts.check_deploy
    startCommand: uvicorn be.app:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 8
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: HF_SPACE_ID
        value: ayaayaa/still-e-okay-ai
      - key: HF_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://kenal-e.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: REFERENCE_IMAGE_BASE_URL
        value: https://huggingface.co/datasets/ayaayaa/kenal-e-thumbnails/resolve/9800cac5b0554d5acfeb92d730e9791aee485a17/images
      - key: AI_TIMEOUT_SECONDS
        value: "180"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
